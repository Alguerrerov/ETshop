<ion-header>
  <ion-toolbar>
    <ion-title>etshop</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar celular, portátil, marca..."
      [debounce]="300"
      (ionInput)="onBuscar($event.detail.value)">
    </ion-searchbar>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="tipoActivo" (ionChange)="onTipo($event.detail.value)">
      <ion-segment-button value="todos"><ion-label>Todos</ion-label></ion-segment-button>
      <ion-segment-button value="celular"><ion-label>Celulares</ion-label></ion-segment-button>
      <ion-segment-button value="portatil"><ion-label>Portátiles</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
<div class="home-container">
  <h2 class="section-title">Últimos lanzamientos</h2>

  <app-filtros
    [marcas]="(marcas$ | async) ?? []"
    (cambioFiltros)="onCambioFiltros($event)">
  </app-filtros>

  <div class="grid" *ngIf="dispositivos$ | async as dispositivos; else cargando">
    <app-product-card
      *ngFor="let d of dispositivos"
      [dispositivo]="d">
    </app-product-card>

    <p *ngIf="dispositivos.length === 0" class="sin-resultados">
      No se encontraron dispositivos con esos filtros.
    </p>
  </div>

  <ng-template #cargando>
    <p>Cargando dispositivos...</p>
  </ng-template>
</div>
</ion-content>
